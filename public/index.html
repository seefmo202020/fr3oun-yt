<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رفع ذكي على يوتيوب</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mut:#6b7380;--pri:#e11d2e;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mut:#9aa3af;--bd:#2a2f38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;margin-top:16px;cursor:pointer}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--bd);margin-top:8px}
button:disabled{opacity:.5}
.ch{display:flex;align-items:center;gap:10px}
.ch img{width:40px;height:40px;border-radius:50%}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.steps div{padding:4px 0;color:var(--mut)}
.steps .on{color:var(--tx);font-weight:600}
.steps .ok{color:#16a34a}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--bg);padding:10px;border-radius:10px;font-size:14px}
a{color:var(--pri)}
.err{color:#dc2626}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>🎬 رفع ذكي على يوتيوب</h1>

<div id="connect" class="card hide">
  <p>اربط قناتك على يوتيوب عشان تبدأ.</p>
  <button onclick="location.href='/auth/google'">ربط قناة يوتيوب</button>
</div>

<div id="app" class="hide">
  <div class="card ch">
    <img id="thumb" alt="">
    <div style="flex:1"><div id="chname" style="font-weight:600"></div><div style="font-size:13px;color:var(--mut)">القناة متربطة ✓</div></div>
    <button class="sec" style="width:auto;margin:0;padding:6px 12px" onclick="logout()">فصل</button>
  </div>

  <div class="card" id="form">
    <label>الفيديو</label>
    <input type="file" id="video" accept="video/*">
    <label>الخصوصية</label>
    <select id="privacy">
      <option value="private">خاص (Private)</option>
      <option value="unlisted">غير مدرج (Unlisted)</option>
      <option value="public">عام (Public)</option>
    </select>
    <label>لغة المحتوى (اختياري، سيبها فاضية للتحديد التلقائي)</label>
    <input id="lang" placeholder="مثال: ar أو en">
    <label>ملاحظات للذكاء الاصطناعي (اختياري)</label>
    <textarea id="hint" rows="2" placeholder="مثال: ده فيديو عن ..."></textarea>
    <button id="go" onclick="start()">ارفع وحلّل</button>
  </div>

  <div class="card hide" id="prog">
    <div class="steps">
      <div id="s1">1) رفع الفيديو للموقع</div>
      <div id="s2">2) تحليل الفيديو وتوليد العنوان والوصف والتاجز</div>
      <div id="s3">3) رفع الفيديو على يوتيوب</div>
    </div>
    <div class="bar"><i id="pb"></i></div>
    <div id="msg" style="margin-top:10px"></div>
    <pre id="meta" class="hide"></pre>
    <button class="sec hide" id="again" onclick="reset()">فيديو جديد</button>
  </div>
</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const show = (id, v = true) => $(id).classList.toggle('hide', !v);

async function init() {
  const me = await (await fetch('/api/me')).json();
  show('connect', !me.connected);
  show('app', me.connected);
  if (me.connected) { $('chname').textContent = me.title; $('thumb').src = me.thumb; }
}
async function logout() { await fetch('/auth/logout', { method: 'POST' }); init(); }

function mark(active) {
  ['s1', 's2', 's3'].forEach((id, i) => {
    const n = i + 1;
    $(id).className = n < active ? 'ok' : n === active ? 'on' : '';
  });
}
function reset() { show('form'); show('prog', false); show('meta', false); show('again', false); $('video').value = ''; $('pb').style.width = '0'; $('go').disabled = false; }

function start() {
  const f = $('video').files[0];
  if (!f) return alert('اختار فيديو الأول');
  const fd = new FormData();
  fd.append('privacy', $('privacy').value);
  fd.append('lang', $('lang').value.trim());
  fd.append('hint', $('hint').value.trim());
  fd.append('video', f);
  $('go').disabled = true; show('form', false); show('prog'); mark(1); $('msg').textContent = '';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) $('pb').style.width = (e.loaded / e.total * 100) + '%'; };
  xhr.onload = () => {
    let r = {}; try { r = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) return fail(r.error || 'فشل الرفع');
    $('pb').style.width = '100%'; poll(r.jobId);
  };
  xhr.onerror = () => fail('انقطع الاتصال');
  xhr.send(fd);
}

function fail(t) { $('msg').innerHTML = `<span class="err">${t}</span>`; show('again'); }

async function poll(id) {
  const r = await (await fetch('/api/job/' + id)).json();
  if (r.meta) { show('meta'); $('meta').textContent = `العنوان:\n${r.meta.title}\n\nالتاجز:\n${r.meta.tags.join('، ')}\n\n${r.meta.description}`; }
  if (r.step === 'analyzing' || r.step === 'queued') mark(2);
  if (r.step === 'uploading') mark(3);
  if (r.step === 'done') { mark(4); $('msg').innerHTML = `✅ تم الرفع: <a href="${r.url}" target="_blank" rel="noopener">${r.url}</a>`; show('again'); return; }
  if (r.step === 'error') return fail(r.error);
  setTimeout(() => poll(id), 3000);
}
init();
</script>
</body>
</html>

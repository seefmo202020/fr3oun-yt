<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو الرفع الذكي</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1c2230;--tx:#f1f3f7;--mut:#8b94a6;--bd:#262d3d;--pri:#ff2d46;--pri2:#ff8a3d;--ok:#22c55e;--warn:#f59e0b}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--card:#fff;--card2:#f0f2f7;--tx:#12151c;--mut:#667085;--bd:#e2e5ec}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px 14px 80px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero img{width:46px;height:46px;border-radius:50%;border:2px solid #fff6}
.hero b{display:block;font-size:17px}.hero small{opacity:.9}
.hero button{margin:0 auto 0 0;width:auto;padding:6px 12px;background:#0003;font-size:13px}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;margin:0;background:transparent;color:var(--mut);padding:10px}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);font:inherit}
input[type=file]{padding:9px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:700;margin-top:16px;cursor:pointer}
button.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.cnt{font-size:12px;color:var(--mut)}
#tprev{width:100%;border-radius:12px;margin-top:8px;aspect-ratio:16/9;object-fit:cover}
.bar{height:10px;background:var(--card2);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
.steps div{padding:3px 0;color:var(--mut)}.steps .on{color:var(--tx);font-weight:700}.steps .ok{color:var(--ok)}
.eta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:13px}
.pill.big{font-weight:700;color:var(--pri2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:19px}.stat small{color:var(--mut)}
.grid{display:grid;gap:12px}
.v{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer}
.v .th{position:relative;aspect-ratio:16/9;background:var(--card2)}
.v .th img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;bottom:8px;left:8px;background:#000c;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.priv{position:absolute;top:8px;right:8px;border-radius:6px;padding:1px 8px;font-size:12px;color:#fff;background:#000a}
.priv.public{background:var(--ok)}.priv.unlisted{background:var(--warn)}
.v .bd{padding:12px}.v h3{margin:0 0 8px;font-size:15px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet img{width:100%;border-radius:12px}
.spec{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.spec span:first-child{color:var(--mut)}
.desc{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--mut);background:var(--card2);border-radius:12px;padding:10px;margin-top:10px}
a{color:var(--pri2)}.err{color:#ef4444}.warn{color:var(--warn)}.hide{display:none!important}
</style>
</head>
<body>
<main>
<div id="connect" class="card hide" style="text-align:center">
  <h2>🎬 استوديو الرفع الذكي</h2>
  <p style="color:var(--mut)">اربط قناتك على يوتيوب عشان ترفع وتتابع فيديوهاتك.</p>
  <button onclick="location.href='/auth/google'">ربط قناة يوتيوب</button>
</div>

<div id="app" class="hide">
  <div class="hero">
    <img id="thumb" alt="">
    <div><b id="chname"></b><small>القناة متربطة ✓</small></div>
    <button onclick="logout()">فصل</button>
  </div>
  <div class="tabs">
    <button class="on" id="t-up" onclick="tab('up')">⬆️ رفع فيديو</button>
    <button id="t-vids" onclick="tab('vids')">📺 فيديوهاتي</button>
  </div>

  <section id="v-up">
    <div class="card" id="form">
      <label>الفيديو *</label><input type="file" id="video" accept="video/*">
      <label>الصورة المصغرة (JPG/PNG أقل من 2MB)</label>
      <input type="file" id="tfile" accept="image/jpeg,image/png" onchange="prev()">
      <img id="tprev" class="hide" alt="">
      <label>العنوان *</label><input id="title" maxlength="100" oninput="cnt()">
      <div class="cnt"><span id="c">0</span>/100</div>
      <label>الوصف</label><textarea id="desc" rows="5" placeholder="الوصف والهاشتاجات #مثال"></textarea>
      <label>التاجز (افصل بفاصلة)</label><textarea id="tags" rows="2" placeholder="كلمة 1، كلمة طويلة 2"></textarea>
      <label>التصنيف</label>
      <select id="cat">
        <option value="22">أشخاص ومدونات</option><option value="27">تعليم</option><option value="28">علوم وتكنولوجيا</option>
        <option value="24">ترفيه</option><option value="20">ألعاب</option><option value="26">كيف تفعل / أسلوب حياة</option>
        <option value="10">موسيقى</option><option value="25">أخبار وسياسة</option><option value="19">سفر</option>
        <option value="17">رياضة</option><option value="23">كوميديا</option><option value="1">أفلام وأنيميشن</option>
        <option value="2">سيارات</option><option value="15">حيوانات</option>
      </select>
      <label>لغة الفيديو (اختياري)</label><input id="lang" placeholder="ar أو en">
      <label>الخصوصية</label>
      <select id="privacy"><option value="private">خاص</option><option value="unlisted">غير مدرج</option><option value="public">عام</option></select>
      <button id="go" onclick="start()">ارفع على يوتيوب</button>
    </div>

    <div class="card hide" id="prog">
      <div class="steps">
        <div id="s1">1) رفع الفيديو للموقع</div>
        <div id="s2">2) رفع الفيديو على يوتيوب</div>
        <div id="s3">3) إضافة الصورة المصغرة</div>
      </div>
      <div class="bar"><i id="pb"></i></div>
      <div class="eta" id="eta"></div>
      <div id="msg" style="margin-top:12px"></div>
      <button class="sec hide" id="again" onclick="reset()">فيديو جديد</button>
    </div>
  </section>

  <section id="v-vids" class="hide">
    <div class="stats">
      <div class="stat"><b id="sSubs">-</b><small>مشترك</small></div>
      <div class="stat"><b id="sViews">-</b><small>مشاهدة</small></div>
      <div class="stat"><b id="sVids">-</b><small>فيديو</small></div>
    </div>
    <div id="vmsg" class="cnt"></div>
    <div class="grid" id="grid"></div>
    <button class="sec hide" id="more" onclick="loadVideos(true)">عرض المزيد</button>
  </section>
</div>
</main>

<div id="modal" class="hide" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const show = (id, v = true) => $(id).classList.toggle('hide', !v);
const nf = (n) => Number(n || 0).toLocaleString('ar-EG');
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cnt = () => { $('c').textContent = $('title').value.length; };
const mb = (b) => (b / 1048576).toFixed(1);
const dur = (iso) => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || '') || []; const h = +m[1] || 0, mi = +m[2] || 0, s = +m[3] || 0; return (h ? h + ':' + String(mi).padStart(2, '0') : mi) + ':' + String(s).padStart(2, '0'); };
const hms = (sec) => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m >= 60 ? `${Math.floor(m / 60)} س ${m % 60} د` : m ? `${m} د ${s} ث` : `${s} ث`; };
const wt = (m) => m == null ? '—' : m >= 60 ? `${nf((m / 60).toFixed(1))} ساعة` : `${nf(Math.round(m))} دقيقة`;
const PRIV = { public: 'عام', unlisted: 'غير مدرج', private: 'خاص' };
const catName = (id) => [...$('cat').options].find((o) => o.value === id)?.text || id;

function prev() { const f = $('tfile').files[0]; if (!f) return show('tprev', false); $('tprev').src = URL.createObjectURL(f); show('tprev'); }
function tab(t) {
  show('v-up', t === 'up'); show('v-vids', t === 'vids');
  $('t-up').classList.toggle('on', t === 'up'); $('t-vids').classList.toggle('on', t === 'vids');
  if (t === 'vids' && !vids.length) loadVideos();
}
async function init() {
  const me = await (await fetch('/api/me')).json();
  show('connect', !me.connected); show('app', me.connected);
  if (me.connected) { $('chname').textContent = me.title; $('thumb').src = me.thumb; }
}
async function logout() { await fetch('/auth/logout', { method: 'POST' }); init(); }

/* ---------- الرفع + الوقت المتبقي ---------- */
function mark(a) { ['s1', 's2', 's3'].forEach((id, i) => { $(id).className = i + 1 < a ? 'ok' : i + 1 === a ? 'on' : ''; }); }
function etaUI(done, total, elapsed) {
  if (!done || elapsed < 1) { $('eta').innerHTML = '<span class="pill">بنحسب الوقت...</span>'; return; }
  const speed = done / elapsed, left = (total - done) / speed;
  $('eta').innerHTML = `<span class="pill big">⏳ باقي ${hms(left)}</span><span class="pill">${mb(done)} / ${mb(total)} MB</span><span class="pill">🚀 ${(speed / 1048576).toFixed(1)} MB/ث</span><span class="pill">${Math.round(done / total * 100)}%</span>`;
}
function reset() {
  show('form'); show('prog', false); show('again', false);
  ['video', 'tfile', 'title', 'desc', 'tags'].forEach((id) => { $(id).value = ''; });
  show('tprev', false); cnt(); $('pb').style.width = '0'; $('go').disabled = false;
}
function start() {
  const f = $('video').files[0], title = $('title').value.trim();
  if (!f) return alert('اختار فيديو الأول');
  if (!title) return alert('اكتب عنوان للفيديو');
  const fd = new FormData();
  [['title', title], ['description', $('desc').value], ['tags', $('tags').value], ['category', $('cat').value], ['lang', $('lang').value.trim()], ['privacy', $('privacy').value]].forEach(([k, v]) => fd.append(k, v));
  fd.append('video', f);
  const t = $('tfile').files[0]; if (t) fd.append('thumbnail', t);
  $('go').disabled = true; show('form', false); show('prog'); mark(1); $('msg').textContent = '';
  const t0 = performance.now(), xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = (e) => { if (!e.lengthComputable) return; $('pb').style.width = (e.loaded / e.total * 100) + '%'; etaUI(e.loaded, e.total, (performance.now() - t0) / 1000); };
  xhr.onload = () => { let r = {}; try { r = JSON.parse(xhr.responseText); } catch {} if (xhr.status !== 200) return fail(r.error || 'فشل الرفع'); $('pb').style.width = '0'; $('eta').innerHTML = ''; poll(r.jobId); };
  xhr.onerror = () => fail('انقطع الاتصال');
  xhr.send(fd);
}
function fail(t) { $('msg').innerHTML = `<span class="err">${esc(t)}</span>`; show('again'); }
async function poll(id) {
  const r = await (await fetch('/api/job/' + id)).json();
  if (r.step === 'uploading') { mark(2); $('pb').style.width = (r.progress || 0) + '%'; etaUI(r.uploaded, r.total, r.elapsed); $('msg').textContent = 'جاري الرفع على يوتيوب...'; }
  if (r.step === 'thumbnail') { mark(3); $('pb').style.width = '100%'; $('eta').innerHTML = ''; $('msg').textContent = 'جاري إضافة الصورة المصغرة...'; }
  if (r.step === 'done') {
    mark(4); $('pb').style.width = '100%'; $('eta').innerHTML = '';
    $('msg').innerHTML = `✅ تم الرفع: <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>` + (r.thumbError ? `<p class="warn">${esc(r.thumbError)}</p>` : '');
    show('again'); vids = []; return;
  }
  if (r.step === 'error') return fail(r.error);
  setTimeout(() => poll(id), 1500);
}

/* ---------- فيديوهاتي ---------- */
let vids = [], nextPage = null;
async function loadVideos(more) {
  $('vmsg').textContent = 'جاري التحميل...'; $('more').disabled = true;
  const r = await fetch('/api/videos' + (more && nextPage ? '?page=' + encodeURIComponent(nextPage) : ''));
  const d = await r.json();
  if (!r.ok) { $('vmsg').innerHTML = `<span class="err">${esc(d.error || 'فشل التحميل')}</span>`; $('more').disabled = false; return; }
  if (!more) { vids = []; $('grid').innerHTML = ''; }
  const base = vids.length; vids = vids.concat(d.videos); nextPage = d.nextPage;
  $('sSubs').textContent = nf(d.channel.subs); $('sViews').textContent = nf(d.channel.views); $('sVids').textContent = nf(d.channel.videos);
  $('vmsg').innerHTML = d.analytics ? '' : '<span class="warn">وقت المشاهدة مش متاح: فعّل YouTube Analytics API واعمل فصل ثم ربط للقناة.</span>';
  $('grid').insertAdjacentHTML('beforeend', d.videos.map((v, i) => `
    <div class="v" onclick="openM(${base + i})">
      <div class="th"><img loading="lazy" src="${esc(v.thumb)}" alt=""><span class="badge">${dur(v.duration)}</span><span class="priv ${esc(v.privacy)}">${PRIV[v.privacy] || ''}</span></div>
      <div class="bd"><h3>${esc(v.title)}</h3>
        <div class="chips"><span class="pill">👁 ${nf(v.views)}</span><span class="pill">👍 ${nf(v.likes)}</span><span class="pill">💬 ${nf(v.comments)}</span><span class="pill">⏱ ${wt(v.watchMins)}</span></div></div>
    </div>`).join(''));
  show('more', !!nextPage); $('more').disabled = false;
  if (!vids.length) $('vmsg').textContent = 'مفيش فيديوهات لسه.';
}
function openM(i) {
  const v = vids[i], row = (a, b) => `<div class="spec"><span>${a}</span><span>${b}</span></div>`;
  $('sheet').innerHTML = `<img src="${esc(v.thumb)}" alt=""><h3>${esc(v.title)}</h3>
    ${row('المشاهدات', nf(v.views))}${row('الإعجابات', nf(v.likes))}${row('التعليقات', nf(v.comments))}
    ${row('إجمالي وقت المشاهدة', wt(v.watchMins))}${row('متوسط مدة المشاهدة', v.avgSecs == null ? '—' : hms(v.avgSecs))}
    ${row('مدة الفيديو', dur(v.duration))}${row('الجودة', (v.definition || '').toUpperCase())}${row('البُعد', (v.dimension || '').toUpperCase())}
    ${row('ترجمة', v.caption ? 'موجودة' : 'لا')}${row('الخصوصية', PRIV[v.privacy] || v.privacy)}${row('حالة الرفع', esc(v.uploadStatus))}
    ${row('التصنيف', esc(catName(v.categoryId)))}${row('تاريخ النشر', new Date(v.publishedAt).toLocaleString('ar-EG'))}
    ${row('التاجز', v.tags.length ? esc(v.tags.slice(0, 8).join('، ')) : '—')}
    ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ''}
    <a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener"><button>فتح على يوتيوب</button></a>
    <button class="sec" onclick="closeM()">إغلاق</button>`;
  show('modal');
}
function closeM() { show('modal', false); }
init();
</script>
</body>
</html>
